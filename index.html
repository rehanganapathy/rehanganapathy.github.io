<!DOCTYPE html>
<html lang="en" class="transition-colors duration-300">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rehan Ganapathy – Blog</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Enable dark mode support with Tailwind
    tailwind.config = {
      darkMode: 'class',
    };

    // Apply saved theme on load
    if (localStorage.theme === 'dark' || 
        (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    }
  </script>
</head>
<body class="bg-white dark:bg-gray-900 text-gray-900 dark:text-gray-100 font-sans px-6 py-10 transition-colors duration-300">
  <div class="max-w-3xl mx-auto">
    <header class="mb-12 flex justify-between items-center">
      <div>
        <h1 class="text-4xl font-bold mb-1">Hey, I'm Rehan👋</h1>
        <p class="text-gray-600 dark:text-gray-400">I write about code, side projects, and tech stuff.</p>
      </div>
      <button 
        id="toggleTheme" 
        class="ml-4 text-sm bg-gray-200 dark:bg-gray-700 text-gray-800 dark:text-gray-200 px-3 py-1 rounded hover:bg-gray-300 dark:hover:bg-gray-600 transition"
      >
        Toggle Dark Mode
      </button>
    </header>

    <main>
      <h2 class="text-2xl font-semibold mb-4">Latest Posts</h2>
      <ul class="space-y-6">
        <li>
          <a href="/posts/post1.html" class="text-xl text-blue-600 dark:text-blue-400 hover:underline">How I built my portfolio with no JS</a>
          <p class="text-gray-500 dark:text-gray-400 text-sm">April 12, 2025 • HTML, CSS</p>
        </li>
        <li>
          <a href="/posts/post2.html" class="text-xl text-blue-600 dark:text-blue-400 hover:underline">Simple AI chatbot using Python</a>
          <p class="text-gray-500 dark:text-gray-400 text-sm">April 3, 2025 • Python, AI</p>
        </li>
      </ul>
    </main>

    <footer class="mt-16 text-sm text-gray-400 dark:text-gray-500">
      © 2025 Rehan Ganapathy
    </footer>
  </div>

  <script>
    document.getElementById('toggleTheme').addEventListener('click', () => {
      const htmlEl = document.documentElement;
      htmlEl.classList.toggle('dark');
      localStorage.theme = htmlEl.classList.contains('dark') ? 'dark' : 'light';
    });
  </script>
</body>
</html>
